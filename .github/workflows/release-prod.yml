name: Release Tauri Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Tauri Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build frontend
        run: pnpm build:prod
        env:
          NEXT_PUBLIC_BUILD_MODE: prod

      - name: Sync Tauri bundle version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const fs=require('fs'); const path='src-tauri/tauri.conf.json'; const tag=(process.env.GITHUB_REF_NAME||'').trim(); const version=tag.replace(/^v/,''); if(!version){throw new Error('Missing version tag');} const json=JSON.parse(fs.readFileSync(path,'utf8')); json.version=version; fs.writeFileSync(path, JSON.stringify(json,null,2)+'\n'); console.log('Set tauri.conf.json version to', version);"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Ensure artifacts upload to the GitHub Release for this tag
          tagName: ${{ github.ref_name }}
          releaseName: Patchcord Desktop ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
