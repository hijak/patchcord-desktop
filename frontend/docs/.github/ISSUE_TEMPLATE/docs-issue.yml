---
name: Documentation Issue
description: Report an issue with the documentation
title: "[DOCS] <title>"
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve our documentation!
  - type: input
    id: page
    attributes:
      label: Affected Page
      description: Which page has the issue?
      placeholder: "e.g., /docs/getting-started"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the issue
      placeholder: "What's wrong or missing?"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Fix
      description: How should this be fixed?
      placeholder: "What changes would you suggest?"
    validations:
      required: false
