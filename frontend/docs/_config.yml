title: Patchcord Documentation
description: Official documentation for Patchcord - A modern, developer-focused IRC client
theme: just-the-docs

baseurl: ""
url: "https://patchcord.github.io"

repository: patchcord/patchcord

permalink: pretty

exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      has_children: false
      has_toc: true

# Navigation
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/patchcord/patchcord
  - title: Download Releases
    url: https://github.com/patchcord/patchcord/releases

# Callouts
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: yellow
  danger:
    title: Danger
    color: red

# Mermaid diagrams
mermaid:
  version: "10.6.1"

# Aux links (top right)
aux_links:
  "View on GitHub":
    - "https://github.com/patchcord/patchcord"

# Footer content
footer_content: "Copyright &copy; 2024 Patchcord. Distributed under the MIT License."

# Color scheme
color_scheme: dark

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+
  rel_url: true
  button: false
